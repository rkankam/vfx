claims:
  proven:
    - Strong luma edge enhancement before degradation can leave exaggerated contours after internal detail is removed.
    - Chroma can be degraded more strongly than luma to produce spread/misregistration around otherwise legible structure.
    - Real low-resolution processing makes pixel-scale chroma and blur defects perceptually meaningful after reconstruction.
    - A codec generation inserted before reconstruction can turn inherited errors into signal for the next stage.
  not_proven:
    - Exact historical acquisition chain of the target reference.
    - VHS participation in the target reference.
    - Composite NTSC/PAL participation in the target reference.
    - A unique physical cause for the target halo.
